# PySC configuration — replaces PYSC_* environment variables and hardcoded paths.
# All relative paths resolve against [paths].root.

[paths]
root = "C:/PySC"
production_inputs = "actual_audit_inputs"      # was PYSC_PRODUCTION_AUDIT_ROOT
vendor_inputs = "audit_inputs"
normalized = "actual_audit_inputs/Normalized"  # was PYSC_PRODUCTION_NORMALIZED_ROOT
gap_staging = "actual_audit_inputs/For_Gap"    # was PYSC_PRODUCTION_GAP_ROOT
gap_output = "actual_audit_inputs"             # was PYSC_PRODUCTION_GAP_OUTPUT_ROOT
oscal_catalog = "NIST_SP-800-53_rev5_catalog.json"
threat_intel_cache = "Scripts/threat_intel_cache.json"
history_db = "pysc_history.sqlite"
report_output = "Output"

# Legacy description-match workbook inputs (optional; skipped when absent)
baseline_mssrv_csv = "Baseline_-_MSSRV.csv"                              # was PYSC_BASELINE_MSSRV_CSV
merged_mssrv_csv = "Merged_2607.csv"                                     # was PYSC_MERGED_MSSRV_CSV
description_match_xlsx = "Baseline_vs_Merged_MSSRV_Description_Matches.xlsx"  # was PYSC_DESCRIPTION_MATCH_XLSX

[normalize]
info_sentences = 1
see_also_replacement = "See HTH Policies and Standards"

[maturity]
# Fleet pass-rate threshold (percent). Checks below this get comment-out proposals.
pass_threshold = 90

[report]
# Platforms without a declared production baseline are omitted from the
# executive matrix and dashboard when false (they remain visible in
# pysc gap / library tooling).
show_missing_baselines = false

[library]
# Control library build scope: also scan the latest Normalized generation of
# each input tree (captures PowerShell-converted check mechanics).
include_normalized = true

[downloads]
# Tenable public downloads (anonymous API). 'pysc download' stages new/updated
# benchmarks matching configured platforms into audit_inputs\_incoming_<ts>\.
page = "download-all-compliance-audit-files"
archive = "audits.tar.gz"
cache_dir = "Downloads_Cache"
user_agent = "pysc-audit-toolkit/0.1"

# --- Platform profiles -------------------------------------------------------
# baseline: the production baseline audit for the platform (in production_inputs
# unless an absolute path is given). filename_tokens: case-insensitive
# substrings identifying the platform in Tenable .audit file names (longest
# match wins). Other keys override [normalize] defaults.

[platforms.MSSRV]
baseline = "HTH_MSSRV_BASELINE.audit"
filename_tokens = ["Windows_Server"]

[platforms.MSWRK]
baseline = "HTH_MSWRK_BASELINE.audit"
filename_tokens = ["Windows_11"]

[platforms.SQL]
baseline = "HTH_SQL_BASELINE.audit"
filename_tokens = ["SQL_Server"]

[platforms.RHEL]
baseline = "HTH_Baseline_RHEL.audit"
filename_tokens = ["Hat_Enterprise_Linux"]

[platforms.VMware]
baseline = ""   # no production baseline yet
filename_tokens = ["VMware"]

[platforms.Azure]
baseline = ""   # no production baseline yet
filename_tokens = ["Microsoft_Azure"]

[platforms.AWS]
baseline = ""   # no production baseline yet
filename_tokens = ["Amazon_Web_Services"]

[platforms.NetIOS]
baseline = "HTH_Baseline_NetIOS_AuditFile.audit"
filename_tokens = ["Cisco_IOS"]

[platforms.NetNXOS]
baseline = "HTH_Baseline_NETNXOS.audit"
filename_tokens = ["Cisco_NX"]

[platforms.NetASA]
baseline = "HTH_Baseline_NetASA.audit"
filename_tokens = ["_ASA_"]

[platforms.NetPAFW]
baseline = "HTH_Baseline_NETPAFW.audit"
filename_tokens = ["Palo_Alto"]

[platforms.NetF5]
baseline = "HTH_Baseline_NetF5.audit"
filename_tokens = ["_F5_"]
info_sentences = 3   # F5 keeps richer summaries (legacy Normalize_f5.py behavior)

[platforms.NetACI]
baseline = ""   # no production baseline yet
filename_tokens = ["Cisco_ACI"]
